name: Trusted E2B smoke
on:
  schedule: [{ cron: '17 3 * * *' }]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  smoke:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: e2b-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22.20.0', cache: npm, cache-dependency-path: apps/backend/package-lock.json }
      - run: npm ci
        working-directory: apps/backend
      - name: Require provider configuration
        env: { E2B_API_KEY: '${{ secrets.E2B_API_KEY }}', E2B_TEMPLATE: '${{ secrets.E2B_TEMPLATE }}' }
        run: test -n "$E2B_API_KEY" && test -n "$E2B_TEMPLATE"
      - name: Provider smoke
        env: { E2B_API_KEY: '${{ secrets.E2B_API_KEY }}', E2B_TEMPLATE: '${{ secrets.E2B_TEMPLATE }}' }
        run: node scripts/smoke-e2b.js
