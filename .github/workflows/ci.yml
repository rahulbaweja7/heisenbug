name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heisenbug-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.20.0'

jobs:
  changes:
    name: Detect backend release changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: read
    outputs:
      backend_deploy: ${{ steps.detect.outputs.backend_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Detect changed backend inputs
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base=''
          if [[ "$EVENT_NAME" == pull_request ]]; then
            git fetch --no-tags origin "$BASE_REF" --depth=1
            base="$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")"
          elif [[ "$EVENT_NAME" == push && "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            deployment_ids="$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=production&per_page=30" \
              --jq '.[] | select(.description == "Heisenbug backend") | .id')"
            while IFS= read -r deployment_id; do
              [[ -n "$deployment_id" ]] || continue
              state="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" --jq '.[0].state // empty')"
              if [[ "$state" == success ]]; then
                base="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id" --jq '.sha')"
                [[ -n "$base" ]] && break
              fi
            done <<< "$deployment_ids"
            if [[ -z "$base" && "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]; then
              base="$BEFORE_SHA"
            fi
          elif [[ "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            base="$BEFORE_SHA"
          fi

          if [[ -z "$base" ]]; then
            echo 'backend_deploy=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          backend=false
          while IFS= read -r path; do
            case "$path" in
              apps/backend/*|challenges/*|scripts/test-challenges.py|scripts/deploy-backend.sh|apps/backend/Dockerfile|.dockerignore|deploy/*|.github/workflows/ci.yml)
                backend=true
                break
                ;;
            esac
          done < <(git diff --name-only --no-renames "$base" "$HEAD_SHA")
          echo "backend_deploy=$backend" >> "$GITHUB_OUTPUT"

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - name: Install backend dependencies
        working-directory: apps/backend
        run: npm ci
      - name: Run backend coverage suite
        working-directory: apps/backend
        run: set -o pipefail; npm run test:coverage | tee ../../backend-coverage.txt
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage-${{ github.run_id }}
          path: backend-coverage.txt
          retention-days: 7

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: apps/frontend
        run: set -o pipefail; npm run test:coverage | tee ../../frontend-coverage.txt
      - name: Lint frontend
        working-directory: apps/frontend
        run: npm run lint
      - name: Build frontend
        working-directory: apps/frontend
        env:
          VITE_API_BASE: https://heisenbug-api.kashyaphegde.com
        run: npm run build
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage-${{ github.run_id }}
          path: frontend-coverage.txt
          retention-days: 7

  python-contracts:
    name: Python challenge contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest==8.4.2
      - name: Build isolated challenge runner
        run: docker build -f scripts/challenge-runner.Dockerfile -t heisenbug-challenge-runner:ci .
      - name: Verify workspace file bridge
        run: python3 apps/backend/test/workspace-files.test.py
      - name: Verify CineMatch preview adapter
        run: python3 scripts/test-cinematch-preview.py
      - name: Verify every challenge contract
        run: set -o pipefail; python3 scripts/test-challenges.py --runner docker --json | tee challenge-contracts.json
      - name: Upload challenge report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: challenge-contracts-${{ github.run_id }}
          path: challenge-contracts.json
          retention-days: 7

  browser-tests:
    name: Browser smoke suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            apps/backend/package-lock.json
            apps/frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: apps/backend
        run: npm ci
      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci
      - name: Build frontend for browser tests
        working-directory: apps/frontend
        env:
          VITE_API_BASE: http://127.0.0.1:4001
        run: npm run build
      - name: Install Chromium
        working-directory: apps/frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke suite
        working-directory: apps/frontend
        run: npm run test:e2e
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-diagnostics-${{ github.run_id }}
          path: |
            apps/frontend/playwright-report
            apps/frontend/test-results
          retention-days: 7

  backend-image:
    name: Build and smoke disabled backend image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image
        run: docker build --build-arg BUILD_SHA="$GITHUB_SHA" -f apps/backend/Dockerfile -t heisenbug-backend:ci .
      - name: Start image with execution disabled
        run: |
          docker run -d --name heisenbug-backend-ci -p 127.0.0.1:4001:4001 \
            -e EXECUTION_ENABLED=false \
            -e APP_ORIGIN=http://127.0.0.1:4173 \
            -e API_ORIGIN=http://127.0.0.1:4001 \
            heisenbug-backend:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4001/api/health > health.json; then break; fi
            sleep 1
          done
          test -s health.json
          jq -e --arg sha "$GITHUB_SHA" '.ok == true and .executionEnabled == false and .revision == $sha' health.json
          test "$(curl --fail --silent http://127.0.0.1:4001/api/challenges | jq 'length')" -gt 0
      - name: Verify image cleanup
        if: always()
        run: docker rm -f heisenbug-backend-ci >/dev/null 2>&1 || true

  backend:
    name: backend
    if: always()
    needs: backend-tests
    runs-on: ubuntu-24.04
    steps:
      - name: Preserve backend check
        env:
          RESULT: ${{ needs.backend-tests.result }}
        run: test "$RESULT" = success

  frontend:
    name: frontend
    if: always()
    needs: frontend-checks
    runs-on: ubuntu-24.04
    steps:
      - name: Preserve frontend check
        env:
          RESULT: ${{ needs.frontend-checks.result }}
        run: test "$RESULT" = success

  cinematch-preview:
    name: cinematch-preview
    if: always()
    needs: python-contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Preserve CineMatch preview check
        env:
          RESULT: ${{ needs.python-contracts.result }}
        run: test "$RESULT" = success

  ci-required:
    name: Required checks
    if: always()
    needs: [backend-tests, frontend-checks, python-contracts, browser-tests, backend-image]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all suites to pass
        run: |
          test "${{ needs.backend-tests.result }}" = success
          test "${{ needs.frontend-checks.result }}" = success
          test "${{ needs.python-contracts.result }}" = success
          test "${{ needs.browser-tests.result }}" = success
          test "${{ needs.backend-image.result }}" = success

  publish-backend:
    name: Publish immutable backend image
    needs: [changes, ci-required]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.changes.outputs.backend_deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and push
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          build-args: BUILD_SHA=${{ github.sha }}
          tags: ghcr.io/rahulbaweja7/heisenbug-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-backend:
    name: Deploy and verify backend
    needs: [changes, ci-required, publish-backend]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.changes.outputs.backend_deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: https://heisenbug-api.kashyaphegde.com
    concurrency:
      group: heisenbug-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reject superseded release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh api "repos/$GITHUB_REPOSITORY/commits/${{ github.event.repository.default_branch }}" --jq .sha)"
          test "$latest" = "$GITHUB_SHA" || { echo "A newer default-branch commit exists: $latest" >&2; exit 1; }
      - name: Deploy exact image and verify public endpoints
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
          API_ORIGIN: ${{ vars.API_ORIGIN }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_DIGEST: ${{ needs.publish-backend.outputs.digest }}
          DEPLOYMENT_RECORD_FILE: deployment-record.json
        run: bash scripts/deploy-backend.sh
      - name: Record successful deployment
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          API_ORIGIN: ${{ vars.API_ORIGIN }}
        run: |
          set -euo pipefail
          deployment_id="$(jq -n --arg ref "$GITHUB_SHA" \
            '{ref: $ref, environment: "production", description: "Heisenbug backend", auto_merge: false, required_contexts: []}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
            -f state=success -f description='Public health, catalog, revision, and image digest verified' \
            -f environment_url="$API_ORIGIN"
      - name: Upload deployment record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-deployment-${{ github.sha }}
          path: deployment-record.json
          retention-days: 30
